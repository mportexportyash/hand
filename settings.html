<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Settings - Flex Control</title>
    <style>
        :root {
            --primary: #00d2ff;
            --accent: #e74c3c;
            --dark: #1a1a2e;
            --bg: #0f3460;
        }

        body {
            margin: 0;
            font-family: 'Segoe UI', sans-serif;
            background: var(--bg);
            color: white;
            display: flex;
            height: 100vh;
        }

        /* --- Sidebar --- */
        .sidebar { width: 240px; background: var(--dark); padding: 20px; border-right: 1px solid var(--primary); }
        .sidebar h2 { color: var(--primary); font-size: 1.2rem; }
        .nav-item { padding: 15px 0; border-bottom: 1px solid #333; cursor: pointer; text-decoration: none; color: white; display: block; opacity: 0.6; }
        .nav-item.active { opacity: 1; color: var(--primary); border-left: 3px solid var(--primary); padding-left: 10px; }

        /* --- Main Content --- */
        .main { flex-grow: 1; padding: 40px; overflow-y: auto; }

        .settings-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 25px;
            max-width: 1000px;
        }

        .settings-card {
            background: var(--dark);
            padding: 25px;
            border-radius: 12px;
            border: 1px solid #333;
        }

        .settings-card h3 { margin-top: 0; color: var(--primary); border-bottom: 1px solid #333; padding-bottom: 10px; }

        .control-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; font-size: 0.9rem; opacity: 0.8; }

        /* --- Custom Inputs --- */
        input[type="range"] { width: 100%; cursor: pointer; accent-color: var(--primary); }
        
        select, input[type="text"] {
            width: 100%;
            padding: 10px;
            background: #0f3460;
            border: 1px solid #333;
            color: white;
            border-radius: 5px;
        }

        .btn-save {
            background: var(--primary);
            color: var(--dark);
            border: none;
            padding: 12px 30px;
            border-radius: 5px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        .btn-save:hover { transform: scale(1.05); filter: brightness(1.2); }
        
        .status-dot { height: 10px; width: 10px; background: #00ff00; border-radius: 50%; display: inline-block; margin-right: 5px; }
    </style>
</head>
<body>

    <div class="sidebar">
        <h2>FLEX CONTROL</h2>
        <a href="index.html" class="nav-item">Dashboard</a>
        <a href="hand-mapping.html" class="nav-item">Hand Mapping</a>
        <a href="logs.html" class="nav-item">7-Channel Logs</a>
        <a href="settings.html" class="nav-item active">Settings</a>
    </div>

    <div class="main">
        <h1>Hardware Settings</h1>
        
        <div class="settings-grid">
            <div class="settings-card">
                <h3>Connection</h3>
                <div class="control-group">
                    <label>Port Selection</label>
                    <select id="port">
                        <option>COM3 (Arduino Uno)</option>
                        <option>COM4 (ESP32)</option>
                        <option>WebSocket (127.0.0.1:8080)</option>
                    </select>
                </div>
                <div class="control-group">
                    <label>Baud Rate</label>
                    <select id="baud">
                        <option>9600</option>
                        <option selected>115200</option>
                    </select>
                </div>
                <p><span class="status-dot"></span> System Connected</p>
            </div>

            <div class="settings-card">
                <h3>Calibration</h3>
                <div class="control-group">
                    <label>Global Sensitivity: <span id="sensVal">50</span>%</label>
                    <input type="range" id="sensSlider" min="1" max="100" value="50" oninput="document.getElementById('sensVal').innerText = this.value">
                </div>
                <div class="control-group">
                    <label>Smoothing (Filter Strength)</label>
                    <input type="range" min="0" max="10" value="3">
                </div>
                <button class="btn-save" onclick="alert('Settings Saved Locally')">Auto-Calibrate All</button>
            </div>

            <div class="settings-card">
                <h3>Channel Mapping</h3>
                <div class="control-group">
                    <label>CH1 Assignment</label>
                    <select><option>Thumb</option><option>Wrist</option></select>
                </div>
                <div class="control-group">
                    <label>Data Units</label>
                    <select>
                        <option>Raw (0-1023)</option>
                        <option>Percentage (0-100%)</option>
                        <option>Degrees (0-180°)</option>
                    </select>
                </div>
            </div>
        </div>

        <div style="margin-top: 30px;">
            <button class="btn-save" style="background: #2ecc71;">Apply Changes</button>
            <button class="btn-save" style="background: var(--accent); margin-left: 10px;">Factory Reset</button>
        </div>
    </div>

</body>
</html>
